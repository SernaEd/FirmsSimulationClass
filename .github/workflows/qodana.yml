name: Qodana

# Análisis estático gratuito del backend (Python) con el linter Community de
# Qodana: corre localmente en el runner, sin QODANA_TOKEN ni licencia. El
# frontend (Next.js/TypeScript) no se analiza aquí porque el linter de
# Qodana para JS/TS es de pago (Ultimate) — ver backend/qodana.yaml.

on:
  workflow_dispatch:
  pull_request:
    paths: &qodana-paths
      - "backend/**"
      - ".github/workflows/qodana.yml"
  push:
    branches: [main]
    paths: *qodana-paths

concurrency:
  group: qodana-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Qodana Scan (backend)
        uses: JetBrains/qodana-action@v2026.2.0
        with:
          # --config es obligatorio: sin él, Qodana busca qodana.yaml solo
          # en la raíz del repo (no dentro de --only-directory), no lo
          # encuentra, y termina auto-detectando y usando un linter de pago.
          args: --only-directory backend --config backend/qodana.yaml
          # --changes (usado por pr-mode) no funciona al analizar un
          # subdirectorio del monorepo, así que se escanea todo backend/.
          pr-mode: false
          upload-result: true

      - name: Publicar resultados en el tab de Code scanning
        if: always()
        # No falla el job si el repo no tiene GitHub Advanced Security
        # habilitado (code scanning es de pago en repos privados).
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
