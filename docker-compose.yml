# Docker Compose para DESARROLLO
# Arranque:  docker compose up --build
# Detener:   docker compose down
# Logs:      docker compose logs -f <servicio>

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-America/Mexico_City}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 (no "localhost"): con "localhost" el cliente de MySQL
      # conecta por socket Unix en vez de TCP. En el primer arranque, MySQL
      # levanta un servidor temporal (solo por socket) para correr el SQL
      # de inicialización antes de abrir el puerto TCP real — un ping por
      # socket puede reportar "healthy" mientras el TCP que usan los demás
      # contenedores (mysql:3306, por red de Docker) todavía no acepta
      # conexiones, causando un "Connection refused" en el primer
      # despliegue en vez de esperar de verdad.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      # start_period da gracia durante la fase de inicialización de MySQL
      # (primer arranque en Windows/Docker Desktop puede tomar 3+ min).
      start_period: 300s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: &backend-env
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-1440}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-}
      MAX_ATTACHMENT_SIZE_MB: ${MAX_ATTACHMENT_SIZE_MB:-50}
      TZ: ${TZ:-America/Mexico_City}
    ports:
      # FRONTEND_BIND/BACKEND_BIND por default en todas las interfaces
      # (0.0.0.0, igual que antes). Producción los pone en 127.0.0.1 una
      # vez que nginx queda al frente sirviendo HTTPS (ver DEPLOYMENT.md
      # Fase 5) — así el único punto de entrada público queda en 80/443.
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    volumes:
      # Hot reload: monta el código fuente en el contenedor
      - ./backend:/app
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Sirve solo para desarrollo local: aplica las migraciones pendientes y
  # crea (si no existen) una cuenta admin (1234/1234) y una cuenta alumno
  # (9876/9876) para poder loguearse sin pasar por /auth/register +
  # aprobación manual en cada stack nuevo. Corre una vez y termina
  # (restart: "no") — no es un servidor de larga duración como backend/mysql.
  #
  # docker-compose.prod.yml es un overlay que solo AGREGA/sobreescribe
  # campos de servicios que ya existen aquí — no puede quitar un servicio
  # del archivo base, así que este contenedor igual se construiría (aunque
  # sea brevemente) bajo `-f docker-compose.yml -f docker-compose.prod.yml`.
  # La salvaguarda real vive en el propio script (ENVIRONMENT != "development"
  # => no hace nada), no aquí — ver scripts/seed_dev_data.py.
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
    command: python -m scripts.seed_dev_data
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      TZ: ${TZ:-America/Mexico_City}
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    volumes:
      # Hot reload: monta el código fuente pero preserva node_modules del contenedor
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev
