version: "1.0"

# Community — gratuito, no requiere QODANA_TOKEN ni licencia. (El linter de
# Qodana para JS/TS es de pago, por eso el frontend no se analiza aquí.)
linter: jetbrains/qodana-python-community:latest

# Instala las dependencias antes de analizar para que el linter resuelva
# los imports de FastAPI/SQLAlchemy/Pydantic en vez de marcarlos como error.
# Ruta relativa a la raíz del repo: --only-directory no cambia el cwd.
bootstrap: pip install -r backend/requirements.txt

# Los archivos de migración de Alembic son autogenerados y no se editan a
# mano: su encabezado estándar (`Union[str, Sequence[str], None]`, con
# Sequence de typing) dispara "Invalid type argument" en el linter — falso
# positivo confirmado en el SARIF, no un error real de tipos.
#
# Nota: se intentó excluir aquí también "PyTypeHints" ("Invalid type hints
# definitions and usages", ~110 falsos positivos preexistentes en todo el
# backend sobre `X | None`/`list[X]` — ver YouTrack PY-82979) tanto sin
# `paths` (exclusión global documentada) como con `paths: [backend]`;
# ninguna de las dos redujo el conteo en un run real de CI (confirmado en
# los logs del job, Qodana for Python 2026.2 RC vía el tag `:latest` sin
# pin de versión). En vez de dejar configuración que no hace nada, se
# suprime línea por línea con `# noinspection PyTypeHints` donde aplica.
exclude:
  - name: All
    paths:
      - backend/alembic/versions

# Preservado del qodana.yaml que generó la config web de Qodana Cloud
# (ahora consolidado en este archivo): no está en el perfil "recommended"
# por defecto, hay que habilitarlo explícitamente.
include:
  - name: CheckDependencyLicenses
